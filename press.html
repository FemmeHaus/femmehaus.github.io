<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Press | FemmeHaus</title>
<meta name="description" content="Press mentions, brand assets and media enquiries for FemmeHaus.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Instrument+Serif:ital@0;1&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="press">
<div id="site-header"></div>

<main>
  <section class="hero hero--text hero--short">
    <div class="wrap hero__in">
      <div>
        <span class="label">Press</span>
        <h1>In the <em>news.</em></h1>
        <p class="lede">Coverage of FemmeHaus and assets for writers and partners.</p>
      </div>
    </div>
  </section>

  <section class="sec sec--cream">
    <div class="wrap">
      <div class="head" data-reveal><span class="label">Mentions</span><h2>As <em>seen in.</em></h2></div>
      <div class="press todo" style="opacity:1;padding:18px"><span>[Publication]</span><span>[Publication]</span><span>[Publication]</span></div>
    </div>
  </section>

  <section class="sec sec--wine">
    <div class="wrap split">
      <div data-reveal><span class="label">Assets</span><h2 style="margin:20px 0 22px">Brand <em>assets.</em></h2>
        <p class="lede">Our monogram for editorial and partner use.</p>
        <a class="btn btn--solid" href="assets/img/logo.png" download>Download logo</a></div>
      <div data-reveal><img src="assets/img/logo.png" alt="FemmeHaus fh monogram" style="width:220px;border-radius:50%;margin-left:auto"></div>
    </div>
  </section>

  <section class="sec sec--bone band">
    <div class="wrap" data-reveal>
      <span class="label">Media enquiries</span>
      <h2 style="margin:18px 0 28px">Working on <em>a story?</em></h2>
      <a class="btn btn--solid" href="contact.html">Get in touch</a>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
